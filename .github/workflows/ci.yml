name: C++ and Pack tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Run bounded decode microbenchmark
        run: ./build/kana_decoder_bench
      - name: Verify Japanese reference Pack
        run: python3 tools/verify_pack.py packs/ja-lite
      - name: Run Python Pack and license policy tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
