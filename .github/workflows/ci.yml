name: C++ and Pack tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Run bounded decode microbenchmark
        run: ./build/kana_decoder_bench
      - name: Enforce 100 MiB decode microbenchmark RSS budget
        run: |
          /usr/bin/time -v -o build/decode-memory.log ./build/kana_decoder_bench
          python3 tools/check_memory_budget.py --log build/decode-memory.log --max-rss-mib 100
      - name: Run bounded SURGE runtime microbenchmark
        run: ./build/kana_decoder_surge_bench 50 5
      - name: Measure real Japanese Pack peak RSS
        run: |
          /usr/bin/time -v -o build/pack-memory.log ./build/kana_decoder_eval packs/ja-lite tests/data/ja-smoke-gold.tsv
          python3 tools/check_memory_budget.py --log build/pack-memory.log --max-rss-mib 2048
      - name: Verify Japanese reference Pack
        run: python3 tools/verify_pack.py packs/ja-lite
      - name: Syntax-check SURGE policy calibrator
        run: python3 -m py_compile tools/calibrate_surge_policy.py
      - name: Run Python Pack and license policy tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
