name: Build Sudachi Small Pack

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sudachi-pack.yml"
      - "licenses/sudachidict-small-20260723-source-lock.json"
      - "licenses/sudachi-small-20260723/license-profile.json"
      - "tools/fetch_sudachi_source.py"
      - "tools/import_sudachi_v1.py"
      - "tools/validate_sudachi_pack_inputs.py"
      - "tools/build_sudachi_pack.py"
      - "tools/evaluate_corpus.cpp"
      - "include/kana_decoder/engine.hpp"
      - "src/engine.cpp"
      - "src/lexicon_trie.cpp"
      - "src/morphology_decoder.cpp"
      - "tools/check_memory_budget.py"
      - "tools/evaluate_surge.py"
      - "tests/test_memory_budget.py"
      - "tests/test_surge_probe.py"
  workflow_dispatch:
    inputs:
      max_expanded_gib:
        description: Declared maximum expanded Pack size in GiB
        required: true
        default: "8"

permissions:
  contents: read

jobs:
  build-sudachi-small:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate size input
        env:
          MAX_EXPANDED_GIB: ${{ inputs.max_expanded_gib || '8' }}
        run: |
          python - <<'PY'
          import os
          value = float(os.environ["MAX_EXPANDED_GIB"])
          if not 0.25 <= value <= 64:
              raise SystemExit("max_expanded_gib must be between 0.25 and 64")
          PY

      - name: Download and verify pinned source archives
        run: |
          python tools/fetch_sudachi_source.py \
            --output-dir "$RUNNER_TEMP/sudachi-archives"

      - name: Build and verify Language Pack
        env:
          MAX_EXPANDED_GIB: ${{ inputs.max_expanded_gib || '8' }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          limit = int(float(os.environ["MAX_EXPANDED_GIB"]) * 1024**3)
          command = [
              sys.executable, "tools/build_sudachi_pack.py",
              "--small-zip", os.path.join(os.environ["RUNNER_TEMP"], "sudachi-archives", "small_lex.zip"),
              "--matrix-zip", os.path.join(os.environ["RUNNER_TEMP"], "sudachi-archives", "matrix.def.zip"),
              "--work-dir", os.path.join(os.environ["RUNNER_TEMP"], "sudachi-build"),
              "--output", os.path.join(os.environ["RUNNER_TEMP"], "ja-jp-sudachi-small"),
              "--max-expanded-bytes", str(limit),
          ]
          subprocess.run(command, check=True)
          PY

      - name: Build native runtime and evaluate real Pack under memory ceiling
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/kana-runtime-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/kana-runtime-build" --target kana_decoder_eval --parallel 2
          # RLIMIT_DATA bounds heap/data allocations; the post-run RSS check
          # independently guards total resident memory including mapped pages.
          ulimit -d $((1792 * 1024))
          /usr/bin/time -v -o "$RUNNER_TEMP/sudachi-runtime-time.log" \
            "$RUNNER_TEMP/kana-runtime-build/kana_decoder_eval" \
            "$RUNNER_TEMP/ja-jp-sudachi-small" tests/data/ja-smoke-gold.tsv --trace --lattice-trace \
            > "$RUNNER_TEMP/sudachi-runtime-evaluation.json"
          cat "$RUNNER_TEMP/sudachi-runtime-evaluation.json"
          cat "$RUNNER_TEMP/sudachi-runtime-time.log"
          python tools/check_memory_budget.py --log "$RUNNER_TEMP/sudachi-runtime-time.log" --max-rss-mib 1792
          python tools/evaluate_surge.py "$RUNNER_TEMP/sudachi-runtime-evaluation.json"

      - name: Upload verified Pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: kana-decoder-ja-jp-sudachi-small-20260723
          path: ${{ runner.temp }}/ja-jp-sudachi-small/
          if-no-files-found: error
          retention-days: 30
