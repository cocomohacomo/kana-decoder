name: Build Sudachi Small Pack

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sudachi-pack.yml"
      - "licenses/sudachidict-small-20260723-source-lock.json"
      - "licenses/sudachi-small-20260723/license-profile.json"
      - "tools/fetch_sudachi_source.py"
      - "tools/import_sudachi_v1.py"
      - "tools/validate_sudachi_pack_inputs.py"
      - "tools/build_sudachi_pack.py"
      - "tools/prepare_context_corpus.py"
      - "tools/evaluate_ablation.py"
      - "tools/prepare_ud_gsd_corpus.py"
      - "tools/evaluate_context_ablation.py"
      - "tools/evaluate_surge_clusters.py"
      - "tools/compile_surge_clusters.py"
      - "tests/test_evaluate_surge_clusters.py"
      - "tests/test_compile_surge_clusters.py"
      - "licenses/ud-japanese-gsd-source-lock.json"
      - "tools/evaluate_surge_runtime.cpp"
      - "tools/calibrate_surge_policy.py"
      - "tests/test_calibrate_surge_policy.py"
      - "src/surge_runtime.cpp"
      - "include/kana_decoder/surge_runtime.hpp"
      - "third_party/surge/include/surge/decision.hpp"
      - "third_party/surge/src/decision.cpp"
      - "tests/test_surge_runtime.cpp"
      - "tests/data/empty-train-sequences.tsv"
      - "tests/data/surge-decision-policy.tsv"
      - "tests/data/ja-smoke-gold.tsv"
      - "tools/evaluate_corpus.cpp"
      - "tools/evaluate_sequential_corpus.cpp"
      - "tests/test_evaluate_sequential_decoder.py"
      - "CMakeLists.txt"
      - "include/kana_decoder/engine.hpp"
      - "src/engine.cpp"
      - "src/scoring.cpp"
      - "src/lexicon_trie.cpp"
      - "src/morphology_decoder.cpp"
      - "src/surge_cluster.cpp"
      - "tests/test_surge_cluster.cpp"
      - "tools/check_memory_budget.py"
      - "tools/evaluate_surge.py"
      - "tests/test_memory_budget.py"
      - "tests/test_surge_probe.py"
      - "tests/test_decoder_trace.cpp"
      - "tests/test_prepare_context_corpus.py"
      - "tests/test_evaluate_ablation.py"
      - "tests/test_prepare_ud_gsd_corpus.py"
      - "tests/test_evaluate_context_ablation.py"
  workflow_dispatch:
    inputs:
      max_expanded_gib:
        description: Declared maximum expanded Pack size in GiB
        required: true
        default: "8"

permissions:
  contents: read

jobs:
  build-sudachi-small:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate size input
        env:
          MAX_EXPANDED_GIB: ${{ inputs.max_expanded_gib || '8' }}
        run: |
          python - <<'PY'
          import os
          value = float(os.environ["MAX_EXPANDED_GIB"])
          if not 0.25 <= value <= 64:
              raise SystemExit("max_expanded_gib must be between 0.25 and 64")
          PY

      - name: Download pinned dictionary and evaluation corpus sources
        run: |
          set -euo pipefail
          python tools/fetch_sudachi_source.py \
            --output-dir "$RUNNER_TEMP/sudachi-archives"
          mkdir -p "$RUNNER_TEMP/ud-gsd"
          UD_GSD_COMMIT="c662dc96ed5ee5ac0fc8b5e44261557e431f50e6"
          for split in train dev test; do
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/UniversalDependencies/UD_Japanese-GSD/$UD_GSD_COMMIT/ja_gsd-ud-$split.conllu" \
              --output "$RUNNER_TEMP/ud-gsd/ja_gsd-ud-$split.conllu"
          done
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/UniversalDependencies/UD_Japanese-GSD/$UD_GSD_COMMIT/LICENSE.txt" \
            --output "$RUNNER_TEMP/ud-gsd/LICENSE.txt"
          sha256sum "$RUNNER_TEMP"/ud-gsd/*

      - name: Build base Pack and run held-out contextual ablation
        env:
          MAX_EXPANDED_GIB: ${{ inputs.max_expanded_gib || '8' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess, sys
          limit = int(float(os.environ["MAX_EXPANDED_GIB"]) * 1024**3)
          command = [
              sys.executable, "tools/build_sudachi_pack.py",
              "--small-zip", os.path.join(os.environ["RUNNER_TEMP"], "sudachi-archives", "small_lex.zip"),
              "--matrix-zip", os.path.join(os.environ["RUNNER_TEMP"], "sudachi-archives", "matrix.def.zip"),
              "--work-dir", os.path.join(os.environ["RUNNER_TEMP"], "sudachi-build"),
              "--output", os.path.join(os.environ["RUNNER_TEMP"], "ja-jp-sudachi-small"),
              "--max-expanded-bytes", str(limit),
          ]
          subprocess.run(command, check=True)
          PY
          LEXICON="$RUNNER_TEMP/sudachi-build/normalized/lexicon.tsv"
          mkdir -p "$RUNNER_TEMP/context-corpus"
          python tools/prepare_ud_gsd_corpus.py \
            --input-dir "$RUNNER_TEMP/ud-gsd" \
            --lexicon "$LEXICON" \
            --output "$RUNNER_TEMP/context-corpus/tokenized.tsv" \
            --source-commit "c662dc96ed5ee5ac0fc8b5e44261557e431f50e6"
          python tools/prepare_context_corpus.py \
            --lexicon "$LEXICON" \
            --corpus "$RUNNER_TEMP/context-corpus/tokenized.tsv" \
            --output-dir "$RUNNER_TEMP/context-corpus/compiled"
          python tools/evaluate_context_ablation.py \
            --lexicon "$LEXICON" \
            --corpus "$RUNNER_TEMP/context-corpus/tokenized.tsv" \
            --train-sequences "$RUNNER_TEMP/context-corpus/compiled/train_sequences.tsv" \
            --context-margin 0.5 --min-test-tokens 1000 \
            --output "$RUNNER_TEMP/context-ablation.json"
          cat "$RUNNER_TEMP/context-corpus/ud_gsd_manifest.json"
          cat "$RUNNER_TEMP/context-corpus/compiled/corpus_manifest.json"
          cat "$RUNNER_TEMP/context-ablation.json"
          python tools/evaluate_surge_clusters.py \
            --lexicon "$LEXICON" \
            --corpus "$RUNNER_TEMP/context-corpus/tokenized.tsv" \
            --train-sequences "$RUNNER_TEMP/context-corpus/compiled/train_sequences.tsv" \
            --output "$RUNNER_TEMP/surge-cluster-evaluation.json"
          cat "$RUNNER_TEMP/surge-cluster-evaluation.json"
          python tools/compile_surge_clusters.py \
            --lexicon "$LEXICON" \
            --corpus "$RUNNER_TEMP/context-corpus/tokenized.tsv" \
            --train-sequences "$RUNNER_TEMP/context-corpus/compiled/train_sequences.tsv" \
            --output "$RUNNER_TEMP/surge-cluster-model.tsv"
          cat "$RUNNER_TEMP/surge-cluster-model.tsv.manifest.json"

      - name: Build native runtime and evaluate real Pack under memory ceiling
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/kana-runtime-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/kana-runtime-build" --target kana_decoder_eval kana_decoder_sequential_eval kana_decoder_surge_eval --parallel 2
          # RLIMIT_DATA leaves room for allocator virtual arenas; the post-run RSS check
          # independently guards total resident memory including mapped pages.
          ulimit -d $((3072 * 1024))
          /usr/bin/time -v -o "$RUNNER_TEMP/sudachi-runtime-time.log" \
            "$RUNNER_TEMP/kana-runtime-build/kana_decoder_eval" \
            "$RUNNER_TEMP/ja-jp-sudachi-small" tests/data/ja-smoke-gold.tsv --trace --lattice-trace \
            > "$RUNNER_TEMP/sudachi-runtime-evaluation.json"
          cat "$RUNNER_TEMP/sudachi-runtime-evaluation.json"
          cat "$RUNNER_TEMP/sudachi-runtime-time.log"
          python tools/check_memory_budget.py --log "$RUNNER_TEMP/sudachi-runtime-time.log" --max-rss-mib 1792
          python tools/evaluate_surge.py "$RUNNER_TEMP/sudachi-runtime-evaluation.json"
          python tools/evaluate_ablation.py "$RUNNER_TEMP/sudachi-runtime-evaluation.json"
          /usr/bin/time -v -o "$RUNNER_TEMP/surge-calibration-time.log" \
            "$RUNNER_TEMP/kana-runtime-build/kana_decoder_sequential_eval" \
            "$RUNNER_TEMP/ja-jp-sudachi-small" \
            "$RUNNER_TEMP/context-corpus/compiled/train_sequences.tsv" \
            "$RUNNER_TEMP/context-corpus/tokenized.tsv" \
            dev-calibrate "$RUNNER_TEMP/surge-calibration.tsv" "$RUNNER_TEMP/surge-cluster-model.tsv" \
            > "$RUNNER_TEMP/surge-dev-calibration.json"
          cat "$RUNNER_TEMP/surge-dev-calibration.json"
          cat "$RUNNER_TEMP/surge-calibration.tsv"
          cat "$RUNNER_TEMP/surge-calibration-time.log"
          python tools/check_memory_budget.py --log "$RUNNER_TEMP/surge-calibration-time.log" --max-rss-mib 1792
          /usr/bin/time -v -o "$RUNNER_TEMP/sequential-runtime-time.log" \
            "$RUNNER_TEMP/kana-runtime-build/kana_decoder_sequential_eval" \
            "$RUNNER_TEMP/ja-jp-sudachi-small" \
            "$RUNNER_TEMP/context-corpus/compiled/train_sequences.tsv" \
            "$RUNNER_TEMP/context-corpus/tokenized.tsv" \
            test "$RUNNER_TEMP/surge-calibration.tsv" "$RUNNER_TEMP/surge-cluster-model.tsv" \
            > "$RUNNER_TEMP/sequential-decoder-evaluation.json"
          cat "$RUNNER_TEMP/sequential-decoder-evaluation.json"
          cat "$RUNNER_TEMP/sequential-runtime-time.log"
          python tools/check_memory_budget.py --log "$RUNNER_TEMP/sequential-runtime-time.log" --max-rss-mib 1792
          python -m py_compile tools/calibrate_surge_policy.py
          python -m py_compile tools/calibrate_surge_policy.py
          python tools/calibrate_surge_policy.py \
            --evaluator "$RUNNER_TEMP/kana-runtime-build/kana_decoder_surge_eval" \
            --pack "$RUNNER_TEMP/ja-jp-sudachi-small" \
            --corpus "$RUNNER_TEMP/context-corpus/tokenized.tsv" \
            --train-sequences "$RUNNER_TEMP/context-corpus/compiled/train_sequences.tsv" \
            --source-lock "licenses/ud-japanese-gsd-source-lock.json" \
            --max-rss-mib 1792 \
            --output-policy "$RUNNER_TEMP/surge-core-decision-policy.tsv" \
            --output-report "$RUNNER_TEMP/surge-core-policy-calibration.json"
          /usr/bin/time -v -o "$RUNNER_TEMP/surge-core-runtime-time.log" \
            "$RUNNER_TEMP/kana-runtime-build/kana_decoder_surge_eval" \
            "$RUNNER_TEMP/ja-jp-sudachi-small" \
            "$RUNNER_TEMP/context-corpus/tokenized.tsv" \
            test "$RUNNER_TEMP/context-corpus/compiled/train_sequences.tsv" \
            "$RUNNER_TEMP/surge-core-decision-policy.tsv" \
            > "$RUNNER_TEMP/surge-core-runtime-evaluation.json"
          cat "$RUNNER_TEMP/surge-core-runtime-evaluation.json"
          cat "$RUNNER_TEMP/surge-core-runtime-time.log"
          python tools/check_memory_budget.py --log "$RUNNER_TEMP/surge-core-runtime-time.log" --max-rss-mib 1792

      - name: Upload SURGE Core real-data evaluation
        uses: actions/upload-artifact@v4
        with:
          name: surge-core-real-data-evaluation
          path: |
            ${{ runner.temp }}/surge-core-runtime-evaluation.json
            ${{ runner.temp }}/surge-core-runtime-time.log
            ${{ runner.temp }}/surge-core-decision-policy.tsv
            ${{ runner.temp }}/surge-core-policy-calibration.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified Pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: kana-decoder-ja-jp-sudachi-small-20260723
          path: ${{ runner.temp }}/ja-jp-sudachi-small/
          if-no-files-found: error
          retention-days: 30

      - name: Upload experimental SURGE cluster model
        uses: actions/upload-artifact@v4
        with:
          name: surge-cluster-model-experimental
          path: |
            ${{ runner.temp }}/surge-cluster-model.tsv
            ${{ runner.temp }}/surge-cluster-model.tsv.manifest.json
          if-no-files-found: error
          retention-days: 30
